openapi: 3.2.0
info:
  title: Cronitor Keys API
  version: '2025-11-28'
  description: 'Monitor cron jobs, heartbeats, websites, and APIs, and manage alerts, issues, status pages, and Real User Monitoring sites. Reference: https://cronitor.io/docs/api'
servers:
- url: https://cronitor.io
security:
- apiKey: []
tags:
- name: Keys
  externalDocs:
    url: https://cronitor.io/docs/api-keys
paths:
  /api/keys:
    get:
      operationId: keys_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - name: Cronitor-Version
        in: header
        required: false
        description: API version. These schemas describe 2025-11-28. Requests without the header get 2020-10-01. https://cronitor.io/docs/api#versioning
        schema:
          type: string
          enum:
          - '2025-11-28'
          - '2020-10-01'
      tags:
      - Keys
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApiKeyList'
          description: ''
      summary: Keys list
      x-summary-source: derived
    post:
      operationId: keys_create
      tags:
      - Keys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
          description: ''
      parameters:
      - name: Cronitor-Version
        in: header
        required: false
        description: API version. These schemas describe 2025-11-28. Requests without the header get 2020-10-01. https://cronitor.io/docs/api#versioning
        schema:
          type: string
          enum:
          - '2025-11-28'
          - '2020-10-01'
      summary: Keys create
      x-summary-source: derived
  /api/keys/{key}:
    get:
      operationId: keys_retrieve
      parameters:
      - in: path
        name: key
        schema:
          type: string
          pattern: ^[A-Za-z0-9\.\-\:]{3,255}$
        required: true
      - name: Cronitor-Version
        in: header
        required: false
        description: API version. These schemas describe 2025-11-28. Requests without the header get 2020-10-01. https://cronitor.io/docs/api#versioning
        schema:
          type: string
          enum:
          - '2025-11-28'
          - '2020-10-01'
      tags:
      - Keys
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
          description: ''
      summary: Keys retrieve
      x-summary-source: derived
    put:
      operationId: keys_update
      parameters:
      - in: path
        name: key
        schema:
          type: string
          pattern: ^[A-Za-z0-9\.\-\:]{3,255}$
        required: true
      - name: Cronitor-Version
        in: header
        required: false
        description: API version. These schemas describe 2025-11-28. Requests without the header get 2020-10-01. https://cronitor.io/docs/api#versioning
        schema:
          type: string
          enum:
          - '2025-11-28'
          - '2020-10-01'
      tags:
      - Keys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
          description: ''
      summary: Keys update
      x-summary-source: derived
    delete:
      operationId: keys_destroy
      parameters:
      - in: path
        name: key
        schema:
          type: string
          pattern: ^[A-Za-z0-9\.\-\:]{3,255}$
        required: true
      - name: Cronitor-Version
        in: header
        required: false
        description: API version. These schemas describe 2025-11-28. Requests without the header get 2020-10-01. https://cronitor.io/docs/api#versioning
        schema:
          type: string
          enum:
          - '2025-11-28'
          - '2020-10-01'
      tags:
      - Keys
      responses:
        '204':
          description: No response body
      summary: Keys destroy
      x-summary-source: derived
components:
  schemas:
    ApiKey:
      type: object
      properties:
        key:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 255
        kind:
          $ref: '#/components/schemas/KindEnum'
        scopes: {}
        immutable:
          type: string
          readOnly: true
        last_used:
          type: string
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        updated:
          type: string
          format: date-time
          readOnly: true
      required:
      - created
      - immutable
      - key
      - last_used
      - name
      - updated
    KindEnum:
      enum:
      - telemetry
      - sdk
      - custom
      type: string
      description: '* `telemetry` - Telemetry

        * `sdk` - SDK Integration

        * `custom` - Custom'
    PaginatedApiKeyList:
      type: object
      required:
      - page
      - page_count
      - page_size
      - total_count
      - data
      properties:
        page:
          type: integer
        page_count:
          type: integer
        page_size:
          type: integer
        total_count:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
    ApiKeyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        kind:
          $ref: '#/components/schemas/KindEnum'
        scopes: {}
      required:
      - name
  securitySchemes:
    apiKey:
      type: http
      scheme: basic
      description: 'Send an API key as the HTTP Basic username with an empty password, for example `curl -u API_KEY: https://cronitor.io/api/monitors`. Keys carry scopes: https://cronitor.io/docs/api-keys'
